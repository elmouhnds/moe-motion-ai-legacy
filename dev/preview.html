<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MOE Motion AI — Preview</title>
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/extension/css/tokens.css">
  <link rel="stylesheet" href="/extension/css/app.css">
  <link rel="stylesheet" href="/extension/css/styles.css">
  <style>
    html, body { background: #111; }
    .frame { position: absolute; top: 28px; left: 16px; bottom: 16px; width: var(--w, 360px); border: 1px solid #333; overflow: hidden; background: var(--bg); }
    .dev-banner { position: absolute; top: 0; left: 0; right: 0; height: 22px; padding: 4px 16px; font: 11px system-ui; color: #999; background: #111; }
  </style>
</head>
<body>
  <div class="dev-banner">PREVIEW · mock AE host · real host/*.jsx</div>
  <div class="frame"><div id="app" style="height:100%"></div></div>
  <script src="/dev/cjs-loader.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get('w')) document.querySelector('.frame').style.setProperty('--w', q.get('w') + 'px');
      var mock = require('/tests/mock/ae-mock.js');
      var fixture = require({ comp: '/dev/preview-fixture-comp.js', studio: '/dev/preview-fixture-studio.js', layout: '/dev/preview-fixture-layout.js' }[q.get('fixture')] || '/dev/preview-fixture.js');
      var mem = require('/dev/platform-mem.js');
      mock.installAE(window, fixture, { readFile: window.__fetchText, evalCode: function (c) { return (0, eval)(c); } });
      var hostDelay = Number(q.get('hostDelay') || 8), churn = q.get('ctxChurn');
      var cs = {
        evalScript: function (script, cb) {
          if (q.get('hostFail') && /evalFile/.test(script)) { setTimeout(function () { cb('MOE_HOST_INIT_ERROR host/ops/expressions.jsx line 51: final is a reserved word'); }, 8); return; }
          if (churn && /context\.get/.test(script) && window.app && window.app.project && window.app.project.activeItem) window.app.project.activeItem.time += 1 / 25;
          setTimeout(function () {
            var r;
            try { r = (0, eval)(script); } catch (e) { r = 'EvalScript error.'; }
            cb(r === undefined ? 'undefined' : String(r));
          }, hostDelay);
        }
      };
      var demoUp = q.get('demoUpdate') ? require('/dev/demo-update.js') : null;
      var platform = mem.createMemPlatform(q.get('demoAI') ? { apiKey: 'sk-ant-preview-demo', http: require('/dev/demo-ai.js') } : (demoUp ? { http: demoUp.http, system: demoUp.system } : {}));
      require('/extension/app/main.js').start({ cs: cs, root: '/extension', platform: platform, mode: q.get('mode') || undefined, ui: { theme: q.get('theme') || 'auto', accent: q.get('accent') || 'tomato', splash: q.get('splash') === '1', banners: q.get('banners') !== '0', motion: q.get('motion') || 'calm', motionV: 2, seenVersion: q.get('fresh') ? '' : '0.36.0' } }).then(function (app) {
        window.__app = app;
        if (demoUp) { app.services.settings.update({ updates: { feedUrl: 'https://updates.example.com/moe/latest.json' } }); app.render(); }
        if (q.get('seedBrand')) {
          app.services.brands.save({ name: 'Nile Bank', notes: 'Gold only on dark backgrounds. Arabic headlines in Cairo Bold.', colors: [
            { name: 'Nile Blue', hex: '#0A4D8C' }, { name: 'Deep Navy', hex: '#0B1F3A' }, { name: 'Gold', hex: '#D4A017' }, { name: 'Sand', hex: '#EBDCC0' }, { name: 'White', hex: '#FFFFFF' }, { name: 'Coral', hex: '#FF6F59' }],
            fonts: { arabic: { ps: 'Cairo-Bold', family: 'Cairo', style: 'Bold' }, english: { ps: 'Montserrat-Bold', family: 'Montserrat', style: 'Bold' }, extra: [] } });
          app.services.brands.save({ name: 'Tomato Studio', colors: [{ name: 'Tomato', hex: '#FF6347' }, { name: 'Ink', hex: '#1A1A1A' }], fonts: { arabic: null, english: { ps: 'ArialMT', family: 'Arial', style: 'Regular' }, extra: [] } });
        }
        if (q.get('view')) app.go(q.get('view'));
      });
    }());
  </script>
</body>
</html>
